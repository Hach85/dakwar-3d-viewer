<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#15191b">
<title>Dakwar Residence | Interactive 3D</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:#15191b;color:#f4eee6;font-family:Arial,Helvetica,sans-serif}
canvas{display:block;touch-action:none}
header{position:absolute;top:0;left:0;padding:20px 26px;z-index:2;pointer-events:none}
h1{font-size:19px;letter-spacing:.13em;margin:3px 0 0}small{color:#d4bfa3;letter-spacing:.12em}
#toolbar{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);display:flex;flex-wrap:wrap;justify-content:center;gap:8px;z-index:2;max-width:96vw}
button{background:#20272bef;border:1px solid #ffffff45;color:white;padding:11px 14px;border-radius:9px;cursor:pointer}
button:hover{background:#495153}
#cutaway{display:flex;align-items:center;gap:8px;background:#20272bef;border:1px solid #ffffff45;padding:6px 11px;border-radius:9px;font-size:12px}
#cutSlider{width:110px;accent-color:#d4bfa3}#cutSlider:disabled{opacity:.4}
#status{position:absolute;top:79px;left:26px;font-size:13px;color:#e2d4c0;z-index:2}
#help{position:absolute;right:22px;top:25px;font-size:12px;color:#d4c6b6;text-align:right;z-index:2}
#viewer{width:100vw;height:100dvh}#error{position:absolute;top:42%;left:10%;right:10%;text-align:center;color:#ffc9a8;z-index:4}
@media(max-width:650px){header{padding:13px}#help{display:none}#status{top:68px;left:13px}#toolbar{bottom:9px;gap:5px}button{padding:9px;font-size:12px}#cutaway{padding:4px}#cutSlider{width:75px}}
</style></head>
<body>
<header><small>INTERACTIVE RESIDENCE</small><h1>DAKWAR / BEDROOM</h1></header>
<div id="help">Drag to rotate · Scroll to zoom<br>Right-drag to pan · Choose a preset to navigate</div>
<div id="status" role="status">Loading 3D model…</div>
<div id="error" role="alert"></div><div id="viewer"></div>
<div id="toolbar">
<button id="home">Overview</button><button id="front">Front</button><button id="side">Side</button><button id="top">Top</button>
<button id="roof">Ceiling cutaway: Off</button>
<label id="cutaway">Cut height <input id="cutSlider" type="range" min="0" max="100" value="82" disabled aria-label="Ceiling cut height"><span id="cutValue">82%</span></label>
<button id="light">Evening mode</button><button id="spin">Auto-rotate: Off</button><button id="full">Fullscreen</button>
</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const root=document.querySelector('#viewer'),status=document.querySelector('#status'),err=document.querySelector('#error');
const scene=new THREE.Scene();scene.background=new THREE.Color('#a7aaa9');
const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.01,100000);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setSize(innerWidth,innerHeight);
renderer.localClippingEnabled=true;
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.3;
root.appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.dampingFactor=.07;
const ambient=new THREE.HemisphereLight(0xffffff,0x5b544b,2.3);scene.add(ambient);
const sun=new THREE.DirectionalLight(0xfff1d9,2.8);sun.position.set(20,35,25);scene.add(sun);
const center=new THREE.Vector3();
let radius=10,evening=false,model=null,cutEnabled=false,cutMin=0,cutMax=1;
const cutPlane=new THREE.Plane(new THREE.Vector3(0,-1,0),0);
const cutSlider=document.querySelector('#cutSlider'),cutValue=document.querySelector('#cutValue'),roofButton=document.querySelector('#roof');
function updateCut(){
 const fraction=Number(cutSlider.value)/100;
 cutValue.textContent=cutSlider.value+'%';
 cutPlane.constant=cutMin+(cutMax-cutMin)*fraction;
}
function toggleCut(){
 if(!model)return;
 cutEnabled=!cutEnabled;
 model.traverse(o=>{
   if(!o.isMesh)return;
   const mats=Array.isArray(o.material)?o.material:[o.material];
   for(const m of mats){if(!m)continue;m.clippingPlanes=cutEnabled?[cutPlane]:null;m.clipShadows=false;m.needsUpdate=true;}
 });
 cutSlider.disabled=!cutEnabled;
 roofButton.textContent='Ceiling cutaway: '+(cutEnabled?'On':'Off');
 updateCut();
}
roofButton.onclick=toggleCut;cutSlider.addEventListener('input',updateCut);
function preset(direction){
 const d=new THREE.Vector3(...direction).normalize();
 camera.position.copy(center).addScaledVector(d,radius*2.2);
 camera.near=Math.max(.001,radius/1000);
 camera.far=Math.max(1000,radius*100);
 camera.updateProjectionMatrix();
 controls.target.copy(center);controls.update();
}
new GLTFLoader().load('./dakwar.glb',g=>{
 scene.add(g.scene);model=g.scene;
 const bounds=new THREE.Box3().setFromObject(g.scene);
 bounds.getCenter(center);cutMin=bounds.min.y;cutMax=bounds.max.y;
 updateCut();
 radius=Math.max(bounds.getSize(new THREE.Vector3()).length()*.5,.1);
 controls.minDistance=Math.max(radius*.02,.05);
 controls.maxDistance=radius*12;
 preset([1,.65,1]);
 status.textContent='3D model ready';
},p=>{if(p.total)status.textContent='Loading model · '+Math.round(p.loaded/p.total*100)+'%';},e=>{
 err.textContent='Model could not load. Make sure dakwar.glb is uploaded in the repository root.';
 status.textContent='Model load failed';console.error(e);
});
document.querySelector('#home').onclick=()=>preset([1,.65,1]);
document.querySelector('#front').onclick=()=>preset([0,.25,1]);
document.querySelector('#side').onclick=()=>preset([1,.25,0]);
document.querySelector('#top').onclick=()=>preset([0,1,.001]);
document.querySelector('#light').onclick=e=>{
 evening=!evening;
 ambient.intensity=evening?.65:2.3;sun.intensity=evening?.6:2.8;
 renderer.toneMappingExposure=evening?.85:1.3;
 scene.background.set(evening?'#26252b':'#a7aaa9');
 e.target.textContent=evening?'Day mode':'Evening mode';
};
document.querySelector('#spin').onclick=e=>{
 controls.autoRotate=!controls.autoRotate;e.target.textContent='Auto-rotate: '+(controls.autoRotate?'On':'Off');
};
document.querySelector('#full').onclick=()=>{
 if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();
 else document.exitFullscreen?.();
};
window.addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);
});
renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera)});
</script></body></html>
